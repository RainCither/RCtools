# GitHub Actions 流程。对 dev 分支推送、PR 和手动触发进行安装、构建与浏览器验证；推送和手动触发验证成功后部署 dist/client/ 到 GitHub Pages。
name: Deploy GitHub Pages

on:
  push:
    branches: [dev]
  # PR 执行验证；发布步骤由事件条件限制到推送和手动触发。
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build static site
        env:
          PAGES_BASE_PATH: /
          PAGES_CUSTOM_DOMAIN: tool.raincither.top
        run: npm run pages:build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify browser behavior
        env:
          QA_ARTIFACTS_DIR: ${{ runner.temp }}/rctools-quality
        run: npm run test:e2e

      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality
          path: ${{ runner.temp }}/rctools-quality

      # 只上传已完成构建与浏览器验证的客户端静态产物。
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
